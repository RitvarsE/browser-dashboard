<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mana cilne</title>
    <style>
      :root {
        --bg: #0d1117;
        --bg-soft: #161b22;
        --bg-elev: #1c2230;
        --border: #262c39;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent-soft: rgba(88, 166, 255, 0.14);
        --green: #3fb950;
        --danger: #f85149;
        --radius: 14px;
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(
            1200px 600px at 80% -10%,
            rgba(88, 166, 255, 0.08),
            transparent 60%
          ),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        position: relative;
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      /* --- Augšdaļa: pulkstenis --- */
      header {
        text-align: center;
        margin-bottom: 44px;
      }

      #clock {
        font-size: clamp(48px, 12vw, 92px);
        font-weight: 700;
        letter-spacing: 2px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      #clock .sec {
        color: var(--accent);
      }

      #date {
        margin-top: 10px;
        color: var(--muted);
        font-size: 17px;
        text-transform: capitalize;
      }

      #greeting {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }

      /* --- Režģis --- */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px 22px;
        box-shadow: var(--shadow);
      }

      .card h2 {
        margin: 0 0 16px;
        font-size: 15px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .card h2 .badge {
        font-size: 12px;
        font-weight: 600;
        text-transform: none;
        letter-spacing: 0;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 2px 9px;
        border-radius: 999px;
      }

      /* --- Saites --- */
      .links {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
      }

      .links a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: border-color 0.15s, transform 0.05s, background 0.15s;
      }

      .links a:hover {
        border-color: var(--accent);
        background: #202634;
      }

      .links a:active {
        transform: translateY(1px);
      }

      .links a .ico {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        background: var(--accent-soft);
        color: var(--accent);
      }

      /* --- To-do --- */
      .todo-input {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .todo-input input {
        flex: 1;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        padding: 10px 12px;
        font-size: 14px;
        outline: none;
      }

      .todo-input input:focus {
        border-color: var(--accent);
      }

      .todo-input button {
        background: var(--accent);
        color: #08101d;
        border: none;
        border-radius: 10px;
        padding: 0 16px;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
        line-height: 1;
      }

      .todo-input button:hover {
        filter: brightness(1.08);
      }

      ul.todo {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      ul.todo li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
      }

      ul.todo li input[type="checkbox"] {
        appearance: none;
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        border: 2px solid var(--muted);
        border-radius: 5px;
        cursor: pointer;
        position: relative;
      }

      ul.todo li input[type="checkbox"]:checked {
        background: var(--green);
        border-color: var(--green);
      }

      ul.todo li input[type="checkbox"]:checked::after {
        content: "✓";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #08101d;
        font-size: 12px;
        font-weight: 800;
      }

      ul.todo li .txt {
        flex: 1;
        word-break: break-word;
      }

      ul.todo li.done .txt {
        color: var(--muted);
        text-decoration: line-through;
      }

      ul.todo li .del {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 16px;
        opacity: 0;
        transition: opacity 0.15s, color 0.15s;
      }

      ul.todo li:hover .del {
        opacity: 1;
      }

      ul.todo li .del:hover {
        color: var(--danger);
      }

      .empty {
        color: var(--muted);
        font-size: 14px;
        padding: 6px 2px;
      }

      /* --- Spēles --- */
      .games-card {
        grid-column: 1 / -1;
      }

      .games {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 16px;
      }

      .game {
        display: flex;
        flex-direction: column;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--text);
        text-decoration: none;
        overflow: hidden;
        transition: border-color 0.15s, transform 0.06s, box-shadow 0.15s;
      }

      a.game:hover {
        border-color: var(--accent);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      a.game:hover .game-apply {
        background: var(--accent);
        color: #08101d;
      }

      a.game:hover .game-apply .arrow {
        transform: translateX(4px);
      }

      a.game:active {
        transform: translateY(1px);
      }

      .game-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 18px 0;
      }

      .game-title {
        font-weight: 700;
        font-size: 19px;
        line-height: 1.25;
        word-break: break-word;
      }

      .game-badge {
        flex: 0 0 auto;
        font-size: 12px;
        font-weight: 700;
        color: #08101d;
        background: var(--green);
        padding: 4px 12px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .game-rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px 18px 6px;
      }

      .game-row {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 14.5px;
        word-break: break-word;
      }

      .game-row .ic {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-weight: 700;
        font-size: 15px;
      }

      .game-row .ic svg {
        width: 17px;
        height: 17px;
      }

      .game-until {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 18px 16px;
        font-size: 12.5px;
        color: var(--muted);
      }

      .game-until svg {
        width: 14px;
        height: 14px;
        flex: 0 0 14px;
      }

      .game-apply {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px;
        background: var(--bg-soft);
        border-top: 1px solid var(--border);
        font-weight: 600;
        font-size: 14px;
        color: var(--accent);
        transition: background 0.15s, color 0.15s;
      }

      .game-apply .arrow {
        transition: transform 0.15s;
        font-size: 16px;
      }

      .note {
        color: var(--muted);
        font-size: 14px;
        padding: 8px 2px;
      }

      .note code {
        background: var(--bg-elev);
        padding: 1px 6px;
        border-radius: 6px;
        color: var(--accent);
      }

      .spin {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: -2px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .refresh {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 8px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        text-transform: none;
        letter-spacing: 0;
        font-weight: 500;
      }

      .refresh:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* --- Auth josla --- */
      .authbar {
        position: absolute;
        top: 16px;
        right: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        z-index: 5;
      }

      .authbar .who {
        color: var(--muted);
        max-width: 210px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .auth-btn {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 9px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }

      .auth-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      /* --- Pieslēgšanās logs --- */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(5, 8, 13, 0.72);
        backdrop-filter: blur(4px);
        display: grid;
        place-items: center;
        z-index: 50;
        padding: 20px;
      }

      .overlay[hidden] {
        display: none;
      }

      .login {
        width: 100%;
        max-width: 380px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: var(--shadow);
        text-align: center;
      }

      .login h3 {
        margin: 0 0 8px;
        font-size: 21px;
      }

      .login p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .login input {
        width: 100%;
        box-sizing: border-box;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 12px 13px;
        font-size: 14px;
        outline: none;
        margin-bottom: 10px;
      }

      .login input:focus {
        border-color: var(--accent);
      }

      .login button.primary {
        width: 100%;
        background: var(--accent);
        color: #08101d;
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .login button.primary:hover {
        filter: brightness(1.08);
      }

      .login .msg {
        min-height: 18px;
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .login .skip {
        display: inline-block;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
        text-decoration: underline;
        cursor: pointer;
        background: none;
        border: none;
      }

      .login .skip:hover {
        color: var(--text);
      }

      /* --- Saišu rediģēšana --- */
      .link-wrap {
        position: relative;
      }

      .link-wrap .tile-del {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--danger);
        color: #fff;
        border: 2px solid var(--bg-soft);
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .link-wrap:hover .tile-del {
        display: flex;
      }

      .link-add {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .link-add[hidden] {
        display: none;
      }

      .link-add input {
        flex: 1;
        min-width: 90px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 9px;
        padding: 9px 11px;
        font-size: 13px;
        outline: none;
      }

      .link-add input:focus {
        border-color: var(--accent);
      }

      .link-add .la-icon {
        flex: 0 0 52px;
        min-width: 0;
        text-align: center;
      }

      .link-add button {
        background: var(--accent);
        color: #08101d;
        border: none;
        border-radius: 9px;
        padding: 0 14px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="authbar" class="authbar"></div>
      <header>
        <div id="clock">--:--</div>
        <div id="date"></div>
        <div id="greeting"></div>
      </header>

      <div class="grid">
        <!-- Saites -->
        <section class="card">
          <h2>
            Saites
            <button class="refresh" id="link-add-btn" hidden>＋ Saite</button>
          </h2>
          <nav class="links" id="links"></nav>
          <div class="link-add" id="link-add" hidden>
            <input id="la-name" placeholder="Nosaukums" autocomplete="off" />
            <input id="la-url" placeholder="adrese.lv" autocomplete="off" />
            <input
              id="la-icon"
              class="la-icon"
              placeholder="😀"
              maxlength="2"
              autocomplete="off"
            />
            <button id="la-save">Pievienot</button>
          </div>
        </section>

        <!-- To-do -->
        <section class="card">
          <h2>
            Darāmais
            <span class="badge" id="todo-count">0</span>
          </h2>
          <div class="todo-input">
            <input
              id="todo-text"
              type="text"
              placeholder="Pievieno uzdevumu…"
              autocomplete="off"
            />
            <button id="todo-add" title="Pievienot">+</button>
          </div>
          <ul class="todo" id="todo-list"></ul>
        </section>

        <!-- Spēles -->
        <section class="card games-card">
          <h2>
            Atvērtās spēles
            <button class="refresh" id="games-refresh">Atsvaidzināt</button>
          </h2>
          <div id="games-body">
            <div class="note"><span class="spin"></span> Ielādē…</div>
          </div>
        </section>
      </div>
    </div>

    <!-- Pieslēgšanās logs (maģiskā saite e-pastā) -->
    <div id="login-overlay" class="overlay" hidden>
      <div class="login">
        <h3>Pieslēdzies</h3>
        <p>
          Ievadi e-pastu — atsūtīsim pieslēgšanās saiti. Pēc tam tavi uzdevumi
          un saites būs pieejami visās iekārtās.
        </p>
        <input
          id="login-email"
          type="email"
          placeholder="tavs@epasts.lv"
          autocomplete="email"
        />
        <button id="login-send" class="primary">Nosūtīt pieslēgšanās saiti</button>
        <div id="login-msg" class="msg"></div>
        <button id="login-skip" class="skip">Turpināt bez pieslēgšanās</button>
      </div>
    </div>

    <!-- Supabase klients (UMD). Ja neielādējas, lapa strādā lokālā režīmā. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // =====================================================================
      // Konfigurācija — pielāgo šeit
      // =====================================================================
      // Noklusētās saites. Kad esi pieslēdzies, saites glabājas Supabase un ir
      // rediģējamas no lapas; šīs tiek ieliktas datubāzē pirmajā pieslēgšanās reizē.
      const DEFAULT_LINKS = [
        { name: "GNL LT", url: "https://lt.gnl.lv/applications", icon: "🎯" },
        { name: "Gmail", url: "https://mail.google.com", icon: "✉️" },
        { name: "Kalendārs", url: "https://calendar.google.com", icon: "📅" },
        { name: "GitHub", url: "https://github.com", icon: "🐙" },
        { name: "YouTube", url: "https://youtube.com", icon: "▶️" },
        { name: "ChatGPT", url: "https://chat.openai.com", icon: "🤖" },
      ];

      // Cik bieži pašatjaunināt spēļu paneli (ms). 0 = izslēgts.
      const GAMES_AUTO_REFRESH_MS = 5 * 60 * 1000;

      // =====================================================================
      // Pulkstenis
      // =====================================================================
      const clockEl = document.getElementById("clock");
      const dateEl = document.getElementById("date");
      const greetEl = document.getElementById("greeting");
      const DAYS = [
        "svētdiena",
        "pirmdiena",
        "otrdiena",
        "trešdiena",
        "ceturtdiena",
        "piektdiena",
        "sestdiena",
      ];
      const MONTHS = [
        "janvārī",
        "februārī",
        "martā",
        "aprīlī",
        "maijā",
        "jūnijā",
        "jūlijā",
        "augustā",
        "septembrī",
        "oktobrī",
        "novembrī",
        "decembrī",
      ];

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function tick() {
        const now = new Date();
        clockEl.innerHTML =
          pad(now.getHours()) +
          ":" +
          pad(now.getMinutes()) +
          '<span class="sec">:' +
          pad(now.getSeconds()) +
          "</span>";
        dateEl.textContent =
          DAYS[now.getDay()] +
          ", " +
          now.getDate() +
          ". " +
          MONTHS[now.getMonth()];
        const h = now.getHours();
        greetEl.textContent =
          h < 6
            ? "Labu nakti 🌙"
            : h < 12
            ? "Labrīt ☀️"
            : h < 18
            ? "Labdien 👋"
            : "Labvakar 🌆";
      }
      tick();
      setInterval(tick, 1000);

      // =====================================================================
      // Supabase: konfigurācija un pieslēgšanās (e-pasta maģiskā saite)
      // =====================================================================
      let sb = null; // Supabase klients (vai null → lokālais režīms)
      let user = null; // pieslēgtais lietotājs (vai null)
      const SKIP_KEY = "dashboard.skipLogin";

      // "Mākoņa" režīms = ir klients UN esi pieslēdzies. Tad dati iet uz Supabase;
      // citādi dati glabājas lokāli pārlūkā (localStorage / noklusētās saites).
      function cloud() {
        return !!(sb && user);
      }

      const authbar = document.getElementById("authbar");
      const overlay = document.getElementById("login-overlay");
      const emailEl = document.getElementById("login-email");
      const loginMsg = document.getElementById("login-msg");

      async function initSupabase() {
        try {
          const resp = await fetch("/api/config", { cache: "no-store" });
          if (!resp.ok) return;
          const cfg = await resp.json();
          if (cfg.url && cfg.anonKey && window.supabase) {
            sb = window.supabase.createClient(cfg.url, cfg.anonKey);
          }
        } catch (_) {
          sb = null;
        }
      }

      async function boot() {
        await initSupabase();
        if (sb) {
          sb.auth.onAuthStateChange((event, session) => {
            if (event === "SIGNED_IN") localStorage.removeItem(SKIP_KEY);
            user = session ? session.user : null;
            updateAuthUI();
            loadLinks();
            loadTodos();
          });
          const { data } = await sb.auth.getSession();
          user = data.session ? data.session.user : null;
        }
        updateAuthUI();
        await Promise.all([loadLinks(), loadTodos()]);
      }

      function updateAuthUI() {
        if (!sb) {
          // Supabase nav nokonfigurēts — klusi strādājam lokāli.
          authbar.innerHTML = "";
          overlay.hidden = true;
          return;
        }
        if (user) {
          authbar.innerHTML =
            '<span class="who">☁ ' +
            escapeHtml(user.email || "pieslēdzies") +
            "</span>" +
            '<button id="logout-btn" class="auth-btn">Iziet</button>';
          document
            .getElementById("logout-btn")
            .addEventListener("click", () => sb.auth.signOut());
          overlay.hidden = true;
        } else {
          authbar.innerHTML =
            '<button id="login-open" class="auth-btn">☁ Pieslēgties</button>';
          document.getElementById("login-open").addEventListener("click", () => {
            localStorage.removeItem(SKIP_KEY);
            showOverlay();
          });
          if (localStorage.getItem(SKIP_KEY)) overlay.hidden = true;
          else showOverlay();
        }
      }

      function showOverlay() {
        overlay.hidden = false;
        loginMsg.textContent = "";
        emailEl.focus();
      }

      async function sendMagicLink() {
        const email = emailEl.value.trim();
        if (!email || !sb) return;
        loginMsg.textContent = "Sūta…";
        const { error } = await sb.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: location.origin },
        });
        loginMsg.textContent = error
          ? "Kļūda: " + error.message
          : "Pārbaudi e-pastu — nosūtījām pieslēgšanās saiti ✉️";
      }

      document
        .getElementById("login-send")
        .addEventListener("click", sendMagicLink);
      emailEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMagicLink();
      });
      document.getElementById("login-skip").addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.setItem(SKIP_KEY, "1");
        overlay.hidden = true;
      });

      // Atgriežoties cilnē, palasām svaigus datus (sinhronizācija starp iekārtām).
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && cloud()) {
          loadLinks();
          loadTodos();
        }
      });

      // =====================================================================
      // Saites (Supabase, kad pieslēdzies; citādi noklusētās, tikai lasāmas)
      // =====================================================================
      const linksEl = document.getElementById("links");
      const linkAddBtn = document.getElementById("link-add-btn");
      const linkAddForm = document.getElementById("link-add");
      let links = DEFAULT_LINKS.slice();

      function renderLinks() {
        const editable = cloud();
        linkAddBtn.hidden = !editable;
        if (!editable) linkAddForm.hidden = true;

        linksEl.innerHTML = links
          .map((l) => {
            const ico = l.icon
              ? l.icon
              : (l.name || "?").trim().charAt(0).toUpperCase();
            const del =
              editable && l.id
                ? '<button class="tile-del" data-link="' +
                  escapeAttr(l.id) +
                  '" title="Dzēst saiti">✕</button>'
                : "";
            return (
              '<div class="link-wrap">' +
              '<a href="' +
              escapeAttr(l.url) +
              '" target="_blank" rel="noopener"><span class="ico">' +
              escapeHtml(ico) +
              "</span>" +
              escapeHtml(l.name || l.url) +
              "</a>" +
              del +
              "</div>"
            );
          })
          .join("");
      }

      async function loadLinks() {
        if (cloud()) {
          const { data, error } = await sb
            .from("links")
            .select("id,name,url,icon")
            .order("created_at", { ascending: true });
          links = error ? [] : data;
          if (!error && data.length === 0) await seedLinks();
        } else {
          links = DEFAULT_LINKS.slice();
        }
        renderLinks();
      }

      // Pirmajā pieslēgšanās reizē ieliekam noklusētās saites datubāzē.
      async function seedLinks() {
        const key = "dashboard.seeded." + (user ? user.id : "");
        if (localStorage.getItem(key)) return;
        try {
          const { data } = await sb
            .from("links")
            .insert(
              DEFAULT_LINKS.map((l) => ({
                name: l.name,
                url: l.url,
                icon: l.icon || null,
              }))
            )
            .select("id,name,url,icon");
          if (data) links = data;
          localStorage.setItem(key, "1");
        } catch (_) {
          /* ignorējam */
        }
      }

      async function addLink() {
        const name = document.getElementById("la-name").value.trim();
        let url = document.getElementById("la-url").value.trim();
        const icon = document.getElementById("la-icon").value.trim();
        if (!name || !url) return;
        if (!/^https?:\/\//i.test(url)) url = "https://" + url;
        const row = { name, url, icon: icon || null };
        if (cloud()) {
          const { data, error } = await sb
            .from("links")
            .insert(row)
            .select("id,name,url,icon")
            .single();
          if (!error && data) links.push(data);
        } else {
          links.push({ id: uuid(), ...row });
        }
        document.getElementById("la-name").value = "";
        document.getElementById("la-url").value = "";
        document.getElementById("la-icon").value = "";
        linkAddForm.hidden = true;
        renderLinks();
      }

      async function deleteLink(id) {
        links = links.filter((l) => String(l.id) !== String(id));
        renderLinks();
        if (cloud()) await sb.from("links").delete().eq("id", id);
      }

      linkAddBtn.addEventListener("click", () => {
        linkAddForm.hidden = !linkAddForm.hidden;
        if (!linkAddForm.hidden) document.getElementById("la-name").focus();
      });
      document.getElementById("la-save").addEventListener("click", addLink);
      linkAddForm.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addLink();
      });
      linksEl.addEventListener("click", (e) => {
        if (e.target.matches(".tile-del")) {
          e.preventDefault();
          deleteLink(e.target.getAttribute("data-link"));
        }
      });

      // =====================================================================
      // Darāmais (Supabase, kad pieslēdzies; citādi lokāli pārlūkā)
      // =====================================================================
      const STORE_KEY = "dashboard.todos.v1";
      const listEl = document.getElementById("todo-list");
      const countEl = document.getElementById("todo-count");
      const inputEl = document.getElementById("todo-text");
      let todos = [];

      function loadLocalTodos() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr)
            ? arr.map((t) => ({
                id: t.id || uuid(),
                text: t.text,
                done: !!t.done,
              }))
            : [];
        } catch (_) {
          return [];
        }
      }

      function saveLocalTodos() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(todos));
        } catch (_) {
          /* privātais režīms u.tml. — klusi ignorējam */
        }
      }

      async function loadTodos() {
        if (cloud()) {
          const { data, error } = await sb
            .from("todos")
            .select("id,text,done")
            .order("created_at", { ascending: true });
          todos = error ? [] : data;
        } else {
          todos = loadLocalTodos();
        }
        renderTodos();
      }

      function renderTodos() {
        const remaining = todos.filter((t) => !t.done).length;
        countEl.textContent = remaining;
        if (!todos.length) {
          listEl.innerHTML =
            '<div class="empty">Nav uzdevumu. Diena brīva! 🎉</div>';
          return;
        }
        listEl.innerHTML = todos
          .map(
            (t) =>
              '<li class="' +
              (t.done ? "done" : "") +
              '">' +
              '<input type="checkbox" data-id="' +
              escapeAttr(t.id) +
              '"' +
              (t.done ? " checked" : "") +
              " />" +
              '<span class="txt">' +
              escapeHtml(t.text) +
              "</span>" +
              '<button class="del" data-id="' +
              escapeAttr(t.id) +
              '" title="Dzēst">✕</button>' +
              "</li>"
          )
          .join("");
      }

      async function addTodo() {
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = "";
        if (cloud()) {
          const { data, error } = await sb
            .from("todos")
            .insert({ text })
            .select("id,text,done")
            .single();
          if (!error && data) {
            todos.push(data);
            renderTodos();
          }
        } else {
          todos.push({ id: uuid(), text, done: false });
          saveLocalTodos();
          renderTodos();
        }
      }

      async function toggleTodo(id) {
        const t = todos.find((x) => String(x.id) === String(id));
        if (!t) return;
        t.done = !t.done;
        renderTodos();
        if (cloud()) await sb.from("todos").update({ done: t.done }).eq("id", id);
        else saveLocalTodos();
      }

      async function deleteTodo(id) {
        todos = todos.filter((x) => String(x.id) !== String(id));
        renderTodos();
        if (cloud()) await sb.from("todos").delete().eq("id", id);
        else saveLocalTodos();
      }

      document.getElementById("todo-add").addEventListener("click", addTodo);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTodo();
      });
      listEl.addEventListener("click", (e) => {
        const id = e.target.getAttribute("data-id");
        if (!id) return;
        if (e.target.matches(".del")) deleteTodo(id);
        else if (e.target.matches('input[type="checkbox"]')) toggleTodo(id);
      });

      function uuid() {
        return crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      }

      // Startējam visu.
      boot();

      // =====================================================================
      // Spēles no /api/games
      // =====================================================================
      const gamesBody = document.getElementById("games-body");

      // Ikonas (inline SVG — bez ārējiem resursiem).
      const IC = {
        date:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
        loc:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
        players:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        clock:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      };

      async function loadGames() {
        gamesBody.innerHTML =
          '<div class="note"><span class="spin"></span> Ielādē…</div>';
        try {
          const resp = await fetch("/api/games", { cache: "no-store" });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const data = await resp.json();
          renderGames(data);
        } catch (err) {
          // Lokāli (file://) vai bez izvietotās funkcijas /api/games nedarbojas.
          const local = location.protocol === "file:";
          gamesBody.innerHTML =
            '<div class="note">' +
            (local
              ? "Spēļu panelis darbojas tikai izvietotā vidē (Vercel), " +
                "jo tam vajadzīga <code>/api/games</code> funkcija. " +
                "Lokāli atverot failu, dati netiek ielādēti."
              : "Neizdevās ielādēt spēles no <code>/api/games</code>. " +
                "Pēc izvietošanas atver <code>/api/games</code> un pārbaudi JSON.") +
            "</div>";
        }
      }

      function renderGames(data) {
        const classified = ((data && data.games) || []).map(classify);
        // Rādām tikai atvērtās spēles. Ja nevienai spēlei statuss nav
        // nosakāms (parsēšana to nepaķēra), rādām visas kā rezervi.
        const anyKnown = classified.some((g) => g.open !== null);
        const games = anyKnown
          ? classified.filter((g) => g.open === true)
          : classified;

        if (!games.length) {
          gamesBody.innerHTML =
            '<div class="note">Šobrīd nav atvērtu spēļu.' +
            metaLine(data) +
            "</div>";
          return;
        }

        gamesBody.innerHTML =
          '<div class="games">' +
          games.map(card).join("") +
          "</div>" +
          metaLine(data);
      }

      // Uzzīmē vienu spēles kartīti (līdzīgi kā lt.gnl.lv).
      function card(g) {
        const rows = [];
        if (g.price) rows.push(row('<span class="ic">€</span>', g.price));
        if (g.date) rows.push(row('<span class="ic">' + IC.date + "</span>", g.date));
        if (g.location)
          rows.push(row('<span class="ic">' + IC.loc + "</span>", g.location));
        if (g.players)
          rows.push(row('<span class="ic">' + IC.players + "</span>", g.players));

        const badge = g.open ? '<span class="game-badge">Atvērts</span>' : "";
        const until = g.openUntil
          ? '<div class="game-until">' +
            IC.clock +
            "<span>Pieteikums atvērts līdz " +
            escapeHtml(g.openUntil) +
            "</span></div>"
          : "";
        const apply = g.url
          ? '<div class="game-apply">Pieteikties <span class="arrow">→</span></div>'
          : "";

        const inner =
          '<div class="game-top"><div class="game-title">' +
          escapeHtml(g.title || "Spēle") +
          "</div>" +
          badge +
          "</div>" +
          '<div class="game-rows">' +
          rows.join("") +
          "</div>" +
          until +
          apply;

        return g.url
          ? '<a class="game" href="' +
              escapeAttr(g.url) +
              '" target="_blank" rel="noopener">' +
              inner +
              "</a>"
          : '<div class="game">' + inner + "</div>";
      }

      function row(icon, text) {
        return (
          '<div class="game-row">' +
          icon +
          "<span>" +
          escapeHtml(text) +
          "</span></div>"
        );
      }

      function metaLine(data) {
        if (!data || !data.updated) return "";
        let when = data.updated;
        try {
          when = new Date(data.updated).toLocaleTimeString("lv-LV");
        } catch (_) {}
        let s = '<div class="note" style="margin-top:14px">Atjaunināts ' + when;
        if (data.stale) s += " (novecojuši dati — avots nesasniedzams)";
        else if (data.cached) s += " (no keša)";
        return s + "</div>";
      }

      // --- Lauku atpazīšana ---------------------------------------------
      // Strādā gan ar tīriem laukiem (iegultā JSON), gan ar brīvu tekstu
      // (kad spēle atnāk kā viens teksta bloks). Katru lauku mēģina noteikt
      // pēc atslēgas nosaukuma un/vai pēc vērtības formas.
      const LV = "A-Za-z\\u00C0-\\u024F"; // latīņu burti ar diakritiku

      function classify(g) {
        const text = Object.entries(g)
          .filter(([k]) => k !== "url")
          .map(([, v]) => String(v))
          .join("  ");
        const status = matchStatus(g, text);
        return {
          url: g.url || null,
          title: matchTitle(g, text),
          status,
          open: isOpen(status),
          price: firstMatch(
            text,
            /(?:€|EUR)\s*\d+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?\s*(?:€|EUR)/i
          ),
          date: matchDate(text),
          location: matchLocation(g, text),
          players: matchPlayers(text),
          openUntil: matchUntil(text),
        };
      }

      function isOpen(status) {
        if (!status) return null;
        if (/(slēg|sleg|aizvēr|aizver|pilns|full|clos|beidz)/i.test(status))
          return false;
        if (/(atvēr|atver|open)/i.test(status)) return true;
        return null;
      }

      function matchStatus(g, text) {
        const explicit = valueByKey(g, ["status", "state", "stāvoklis"]);
        if (explicit) return explicit;
        // Aizvērtos pārbaudām pirmos, lai virsraksts "Atvērtā spēle"
        // slēgtai spēlei kļūdaini nepadara to par atvērtu.
        if (/(slēgt|slegt|aizvēr|aizver|pilns|\bfull\b|closed|beidz)/i.test(text))
          return "Slēgts";
        if (/(atvērt|atvert|\bopen\b)/i.test(text)) return "Atvērts";
        return null;
      }

      function matchTitle(g, text) {
        const explicit = valueByKey(g, [
          "title",
          "name",
          "nosaukums",
          "heading",
        ]);
        if (explicit) return explicit;
        // Virsraksts parasti ir tieši pirms cenas.
        let m = text.match(
          new RegExp(
            "([" + LV + "][" + LV + " .\\-]{1,40}?)\\s*(?:€|EUR)(?![A-Za-z])"
          )
        );
        if (m && m[1].trim().length > 1) return m[1].trim();
        // Vai aiz "Pieteikties uz:".
        m = text.match(
          new RegExp("Pieteikties uz:?\\s*([" + LV + "][^\\d(]{1,40})", "i")
        );
        if (m && m[1].trim()) return m[1].replace(/\s+/g, " ").trim();
        m = text.match(/Atvērtā?\s+spēle/i);
        if (m) return m[0];
        return null;
      }

      function matchLocation(g, text) {
        const explicit = valueByKey(g, [
          "location",
          "vieta",
          "arēna",
          "arena",
          "adrese",
          "address",
          "place",
        ]);
        if (explicit) return explicit;
        const addr = "(?:iela|rīga|riga|novads|prospekts|bulvāris|gatve|laukums)";
        // Vietas nosaukums + adrese iekavās, piem. "Jugla (Mārkalnes iela 10, Rīga)".
        let m = text.match(
          new RegExp(
            "([" + LV + "][^\\s()]*)\\s*(\\([^)]*" + addr + "[^)]*\\))",
            "i"
          )
        );
        if (m) return (m[1] + " " + m[2]).replace(/\s+/g, " ").trim();
        // Tikai adrese iekavās.
        m = text.match(new RegExp("\\([^)]*" + addr + "[^)]*\\)", "i"));
        if (m) return m[0].replace(/\s+/g, " ").trim();
        return null;
      }

      function matchDate(text) {
        // Izmetam "līdz <datums>", lai galvenais datums nesajaucas ar to.
        const cleaned = text.replace(
          /līdz\s+\d{1,4}[.\/-]\d{1,2}[.\/-]\d{1,4}(?:[ T]\d{1,2}:\d{2})?/gi,
          " "
        );
        const m = cleaned.match(
          /\d{1,4}[.\/-]\d{1,2}[.\/-]\d{1,4}(?:[ T]\d{1,2}:\d{2})?(?:\s*[-–]\s*\d{1,2}:\d{2})?/
        );
        return m ? m[0].replace(/\s+/g, " ").trim() : null;
      }

      function matchUntil(text) {
        const m = text.match(
          /līdz\s+(\d{1,4}[.\/-]\d{1,2}[.\/-]\d{1,4}(?:[ T]\d{1,2}:\d{2})?)/i
        );
        return m ? m[1].trim() : null;
      }

      function matchPlayers(text) {
        const m = text.match(/\b(\d{1,3})\s*\/\s*(\d{1,3})(?!\s*[.\/-]?\d)/);
        return m ? m[1] + " / " + m[2] : null;
      }

      function valueByKey(g, keys) {
        for (const want of keys) {
          const hit = Object.keys(g).find((k) => k.toLowerCase() === want);
          if (hit && g[hit] != null && String(g[hit]).trim())
            return String(g[hit]).trim();
        }
        return null;
      }

      function firstMatch(text, re) {
        const m = text.match(re);
        return m ? m[0].replace(/\s+/g, " ").trim() : null;
      }

      document
        .getElementById("games-refresh")
        .addEventListener("click", loadGames);
      loadGames();
      if (GAMES_AUTO_REFRESH_MS > 0) {
        setInterval(loadGames, GAMES_AUTO_REFRESH_MS);
      }

      // =====================================================================
      // Palīgi
      // =====================================================================
      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
